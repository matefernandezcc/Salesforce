<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Srappi - Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect trick
    // When GitHub Pages can't find a file (e.g. /Salesforce/about),
    // it serves this 404.html. We redirect to index.html with the
    // original path stored in a query parameter so the SPA router
    // can restore the correct route.
    var pathSegmentsToKeep = 1; // Keep 1 segment = "/Salesforce"
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' +
      '?p=' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
